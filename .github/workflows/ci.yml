name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/at_the_open
      BETTER_AUTH_SECRET: ci-secret-at-least-thirty-two-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      MARKET_DATA_MODE: test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: at_the_open
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d at_the_open"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install SST providers
        run: npx sst install

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Validate source
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e
